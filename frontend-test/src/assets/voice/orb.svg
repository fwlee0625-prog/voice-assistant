<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360">
  <defs>
    <!-- Transparent volume lets the stage show through; there is no separate inner disc. -->
    <radialGradient id="volume" cx="49%" cy="47%" r="50%">
      <stop offset="0" stop-color="#116073" stop-opacity=".06"/>
      <stop offset=".38" stop-color="#126779" stop-opacity=".1"/>
      <stop offset=".6" stop-color="#147e90" stop-opacity=".17"/>
      <stop offset=".73" stop-color="#159eaf" stop-opacity=".33"/>
      <stop offset=".83" stop-color="#26c9d1" stop-opacity=".62"/>
      <stop offset=".89" stop-color="#5ce5e4" stop-opacity=".78"/>
      <stop offset=".93" stop-color="#38cbd5" stop-opacity=".46"/>
      <stop offset=".97" stop-color="#22a4ba" stop-opacity=".13"/>
      <stop offset="1" stop-color="#16879d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="light">
      <stop stop-color="#89f3f1" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#44dfdf" stop-opacity=".18"/>
      <stop offset="1" stop-color="#22bbc9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#98f2f3" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#48cddb" stop-opacity=".12"/>
      <stop offset=".65" stop-color="#37bacb" stop-opacity=".08"/>
      <stop offset="1" stop-color="#6aefe5" stop-opacity=".45"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="edge-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>
  <circle cx="180" cy="180" r="171" fill="url(#volume)"/>
  <ellipse cx="113" cy="91" rx="61" ry="30" transform="rotate(-40 113 91)" fill="url(#light)" filter="url(#soft)"/>
  <ellipse cx="216" cy="296" rx="85" ry="25" transform="rotate(-16 216 296)" fill="url(#light)" opacity=".65" filter="url(#soft)"/>
  <circle cx="177" cy="177" r="150" fill="none" stroke="url(#edge)" stroke-width="1.6" filter="url(#edge-soft)"/>
</svg>
