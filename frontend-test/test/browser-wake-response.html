<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>唤醒应答顺序验证</title><style>body{font:16px system-ui;margin:24px}#result{white-space:pre-wrap;line-height:1.7}#run{padding:10px 20px}</style><h1>真实页面唤醒应答验证</h1><p>合成音轨代替麦克风，ASR 使用页面内模拟。会播放本地“我在”。</p><button id="run">验证先应答后收音</button><pre id="result">等待开始</pre><div id="app"></div><script type="module">
import {createApp} from 'vue'
import RecordView from '/src/views/RecordView.vue'
const out=document.querySelector('#result'),run=document.querySelector('#run')
run.onclick=async()=>{
 run.disabled=true;out.textContent='准备真实页面、KWS 与本地提示音'
 const NativeSocket=window.WebSocket,nativeGetUserMedia=navigator.mediaDevices.getUserMedia,nativeStart=AudioBufferSourceNode.prototype.start
 let context,app;let sockets=0,cueStarted=false,cueEnded=false,premature=false
 const wait=ms=>new Promise(r=>setTimeout(r,ms))
 async function until(fn,timeout=20000){const start=performance.now();while(!fn()){if(performance.now()-start>timeout)throw Error('超时：'+document.querySelector('#app').textContent.slice(0,500));await wait(40)}}
 try{
  context=new AudioContext({sampleRate:16000});await context.resume()
  const target=context.createMediaStreamDestination()
  navigator.mediaDevices.getUserMedia=async()=>target.stream
  AudioBufferSourceNode.prototype.start=function(...args){
   if(this.buffer&&Math.abs(this.buffer.duration-0.715)<0.01){cueStarted=true;this.addEventListener('ended',()=>{cueEnded=true},{once:true})}
   return nativeStart.apply(this,args)
  }
  class MockSocket{
   static OPEN=1;readyState=1;bufferedAmount=0;onmessage;onclose;onerror
   constructor(){sockets++;if(!cueEnded)premature=true;setTimeout(()=>this.onmessage?.({data:JSON.stringify({type:'ready'})}),0)}
   send(data){if(typeof data==='string'&&JSON.parse(data).type==='end')this.onmessage?.({data:JSON.stringify({type:'done'})})}
   close(){this.readyState=3;this.onclose?.()}
  }
  window.WebSocket=MockSocket
  app=createApp(RecordView);app.mount('#app')
  const enable=[...document.querySelectorAll('#app button')].find(x=>x.textContent==='开启语音唤醒')
  if(!enable)throw Error('未找到唤醒入口')
  enable.click()
  await until(()=>document.querySelector('#app .stage-hint')?.textContent.includes('本地待机'))
  if(sockets)throw Error('待机提前创建 ASR')
  const bytes=await(await fetch('./fixtures/kws-wake.wav')).arrayBuffer()
  const source=context.createBufferSource();source.buffer=await context.decodeAudioData(bytes);source.connect(target);source.start()
  await until(()=>cueStarted)
  if(sockets||cueEnded)throw Error('提示音尚未播完时不应开始 ASR')
  out.textContent='通过：KWS 唤醒触发本地“我在”\n通过：提示音播放期间未启动 ASR'
  await until(()=>sockets===1)
  if(!cueEnded||premature)throw Error('ASR 未等待提示音结束')
  out.textContent+='\n通过：真实播放 ended 后才连接 ASR\n全部通过'
 }catch(e){out.textContent+='\n失败：'+e.message}
 finally{app?.unmount();await context?.close();window.WebSocket=NativeSocket;navigator.mediaDevices.getUserMedia=nativeGetUserMedia;AudioBufferSourceNode.prototype.start=nativeStart;run.disabled=false}
}
</script></html>
