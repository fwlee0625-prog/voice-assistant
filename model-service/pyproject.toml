[project]
name = "billiards-model-service"
version = "0.1.0"
description = "Independent local model inference service"
requires-python = ">=3.12,<3.14"
dependencies = [
    "laya==0.4.15",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "huggingface-hub>=0.20,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[project.scripts]
model-service = "model_service.__main__:main"
model-download = "model_service.download:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
